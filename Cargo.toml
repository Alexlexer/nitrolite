[package]
name = "nitro"
version = "0.1.0"
edition = "2021"
description = "Minimal replacement for Acer NitroSense: direct ACPI/WMI fan + thermal control"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"

[[bin]]
name = "nitro"
path = "src/main.rs"

