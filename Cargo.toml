[package]
name = "nitro"
version = "0.1.0"
edition = "2021"
description = "Minimal replacement for Acer NitroSense: direct ACPI/WMI fan + thermal control"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_Security",
] }

[[bin]]
name = "nitro"
path = "src/main.rs"
